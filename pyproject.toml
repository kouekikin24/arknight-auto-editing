[project]
name = "arknight-auto-editing"
version = "26.7.10"
description = "明日方舟剪辑工具"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "imageio-ffmpeg",
    # av 13.x 与打包的 ffmpeg.exe 7.1 同代（libswscale 8），scale=area 输出逐位一致；
    # av>=14（FFmpeg 8 代）实测有 ±1 灰阶缩放漂移，故锁定 13.x。
    "av~=13.1",
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
]

[project.scripts]
arknight-auto-editing = "main:main"
